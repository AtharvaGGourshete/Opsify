AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Opsify AWS bootstrap POC. Idempotently ensures the GitHub Actions OIDC
  provider exists, creates a connection-specific deployment role and callback
  Lambda, and registers the AWS connection with Opsify.

Parameters:

  ConnectionId:
    Type: String
    Description: Unique Opsify AWS connection ID.
    AllowedPattern: "^[0-9a-fA-F-]{36}$"

  GitHubUserId:
    Type: String
    Description: GitHub user ID associated with this Opsify connection.

  GitHubOwner:
    Type: String
    Description: GitHub organization or user name.

  GitHubRepository:
    Type: String
    Description: GitHub repository name.

  GitHubBranch:
    Type: String
    Description: GitHub branch allowed to deploy.
    Default: main

  OpsifyCallbackUrl:
    Type: String
    Description: Public Opsify callback endpoint.


Resources:

  # ============================================================
  # 1. Idempotent GitHub OIDC provider manager
  # ============================================================

  OIDCManagerRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName: !Sub "OpsifyOIDCManagerRole-${ConnectionId}"

      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:

          - Effect: Allow

            Principal:
              Service: lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: OpsifyOIDCManagerPolicy

          PolicyDocument:

            Version: "2012-10-17"

            Statement:

              - Sid: OIDCManagement

                Effect: Allow

                Action:
                  - iam:ListOpenIDConnectProviders
                  - iam:GetOpenIDConnectProvider
                  - iam:CreateOpenIDConnectProvider
                  - iam:AddClientIDToOpenIDConnectProvider
                  - iam:DeleteOpenIDConnectProvider

                Resource: "*"


              - Sid: LambdaLogging

                Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource: "*"


  OIDCManagerFunction:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName: !Sub "OpsifyOIDCManager-${ConnectionId}"

      Runtime: python3.12

      Handler: index.handler

      Role: !GetAtt OIDCManagerRole.Arn

      Timeout: 30

      Code:

        ZipFile: |

          import json
          import urllib.request
          import boto3


          iam = boto3.client("iam")

          OIDC_URL = "https://token.actions.githubusercontent.com"

          OIDC_AUDIENCE = "sts.amazonaws.com"


          def send_response(
              event,
              context,
              status,
              reason,
              data=None,
              physical_id=None
          ):

              body = {

                  "Status": status,

                  "Reason": reason,

                  "PhysicalResourceId":
                      physical_id or context.log_stream_name,

                  "StackId": event["StackId"],

                  "RequestId": event["RequestId"],

                  "LogicalResourceId":
                      event["LogicalResourceId"],

                  "Data": data or {}

              }


              request = urllib.request.Request(

                  event["ResponseURL"],

                  data=json.dumps(body).encode("utf-8"),

                  method="PUT"

              )


              request.add_header(
                  "Content-Type",
                  "application/json"
              )


              with urllib.request.urlopen(
                  request,
                  timeout=10
              ) as response:

                  print(
                      "CloudFormation response:",
                      response.status
                  )


          def find_provider():

              response = iam.list_open_id_connect_providers()

              suffix = (
                  "oidc-provider/"
                  "token.actions.githubusercontent.com"
              )


              for provider in response.get(
                  "OpenIDConnectProviderList",
                  []
              ):

                  arn = provider["Arn"]


                  if arn.endswith(suffix):

                      return arn


              return None


          def handler(event, context):

              print(json.dumps(event))


              try:

                  request_type = event["RequestType"]


                  # ------------------------------------------------
                  # DELETE
                  # ------------------------------------------------

                  if request_type == "Delete":

                      physical_id = event.get(
                          "PhysicalResourceId",
                          ""
                      )


                      if physical_id.startswith("created:"):

                          arn = physical_id[
                              len("created:"):
                          ]


                          iam.delete_open_id_connect_provider(

                              OpenIDConnectProviderArn=arn

                          )


                      send_response(

                          event,

                          context,

                          "SUCCESS",

                          "OIDC provider cleanup complete",

                          physical_id=(
                              physical_id
                              or context.log_stream_name
                          )

                      )


                      return


                  previous_id = event.get(
                      "PhysicalResourceId",
                      ""
                  )


                  previous_created = (
                      previous_id.startswith("created:")
                  )


                  arn = find_provider()

                  created = previous_created


                  # ------------------------------------------------
                  # CREATE IF MISSING
                  # ------------------------------------------------

                  if arn is None:

                      try:

                          response = (
                              iam.create_open_id_connect_provider(

                                  Url=OIDC_URL,

                                  ClientIDList=[
                                      OIDC_AUDIENCE
                                  ]

                              )
                          )


                          arn = (
                              response[
                                  "OpenIDConnectProviderArn"
                              ]
                          )


                          created = True


                      except (
                          iam.exceptions
                          .EntityAlreadyExistsException
                      ):

                          arn = find_provider()


                  if arn is None:

                      raise RuntimeError(

                          "GitHub Actions OIDC provider "
                          "could not be found or created"

                      )


                  # ------------------------------------------------
                  # ENSURE STS AUDIENCE EXISTS
                  # ------------------------------------------------

                  details = (
                      iam.get_open_id_connect_provider(

                          OpenIDConnectProviderArn=arn

                      )
                  )


                  if OIDC_AUDIENCE not in (
                      details.get(
                          "ClientIDList",
                          []
                      )
                  ):

                      (
                          iam
                          .add_client_id_to_open_id_connect_provider(

                              OpenIDConnectProviderArn=arn,

                              ClientID=OIDC_AUDIENCE

                          )
                      )


                  # ------------------------------------------------
                  # PRESERVE OWNERSHIP INFORMATION
                  # ------------------------------------------------

                  physical_id = (

                      "created:"
                      if created
                      else
                      "existing:"

                  ) + arn


                  send_response(

                      event,

                      context,

                      "SUCCESS",

                      "GitHub Actions OIDC provider is ready",

                      data={
                          "ProviderArn": arn
                      },

                      physical_id=physical_id

                  )


              except Exception as error:

                  print(
                      "OIDC manager failed:",
                      str(error)
                  )


                  try:

                      send_response(

                          event,

                          context,

                          "FAILED",

                          str(error)

                      )

                  except Exception as response_error:

                      print(
                          "Failed to send CloudFormation response:",
                          str(response_error)
                      )


                  raise


  EnsureGitHubOIDCProvider:
    Type: Custom::EnsureGitHubOIDCProvider

    DependsOn:
      - OIDCManagerFunction

    Properties:

      ServiceToken:
        !GetAtt OIDCManagerFunction.Arn

      ConnectionId:
        !Ref ConnectionId

      ProviderUrl:
        https://token.actions.githubusercontent.com


  # ============================================================
  # 2. Connection-specific GitHub Actions deployment role
  # ============================================================

  OpsifyDeploymentRole:
    Type: AWS::IAM::Role

    DependsOn:
      - EnsureGitHubOIDCProvider

    Properties:

      RoleName:
        !Sub "OpsifyDeploymentRole-${ConnectionId}"

      Description: >
        IAM role assumed by GitHub Actions through GitHub OIDC
        for this Opsify deployment connection.

      AssumeRolePolicyDocument:

        Version: "2012-10-17"

        Statement:

          - Effect: Allow

            Principal:

              Federated:
                !GetAtt EnsureGitHubOIDCProvider.ProviderArn

            Action:
              - sts:AssumeRoleWithWebIdentity

            Condition:

              StringEquals:

                token.actions.githubusercontent.com:aud:
                  sts.amazonaws.com

                token.actions.githubusercontent.com:sub:
                  !Sub "repo:${GitHubOwner}/${GitHubRepository}:ref:refs/heads/${GitHubBranch}"


      Policies:

        - PolicyName: OpsifyDeploymentPolicy

          PolicyDocument:

            Version: "2012-10-17"

            Statement:

              # ------------------------------------------------
              # CloudFormation
              # ------------------------------------------------

              - Sid: CloudFormation

                Effect: Allow

                Action:
                  - cloudformation:*

                Resource: "*"


              # ------------------------------------------------
              # S3
              # ------------------------------------------------

              - Sid: SAMDeploymentBucket

                Effect: Allow

                Action:
                  - s3:*

                Resource: "*"


              # ------------------------------------------------
              # Lambda
              # ------------------------------------------------

              - Sid: Lambda

                Effect: Allow

                Action:

                  - lambda:CreateFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:ListVersionsByFunction
                  - lambda:PublishVersion
                  - lambda:CreateAlias
                  - lambda:UpdateAlias
                  - lambda:DeleteAlias
                  - lambda:GetAlias
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:TagResource
                  - lambda:UntagResource

                Resource: "*"


              # ------------------------------------------------
              # API Gateway
              # ------------------------------------------------

              - Sid: APIGateway

                Effect: Allow

                Action:

                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                  - apigateway:TagResource

                Resource: "*"


              # ------------------------------------------------
              # IAM roles created by SAM
              # ------------------------------------------------

              - Sid: IAMForSAMGeneratedRoles

                Effect: Allow

                Action:

                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:TagRole
                  - iam:UntagRole

                Resource: "*"


              # ------------------------------------------------
              # PassRole
              # ------------------------------------------------

              - Sid: PassRoleToLambda

                Effect: Allow

                Action:
                  - iam:PassRole

                Resource: "*"

                Condition:

                  StringEquals:

                    iam:PassedToService:
                      lambda.amazonaws.com


              # ------------------------------------------------
              # CloudWatch Logs
              # ------------------------------------------------

              - Sid: CloudWatchLogs

                Effect: Allow

                Action:

                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:TagResource

                Resource: "*"


  # ============================================================
  # 3. Callback Lambda role
  # ============================================================

  AWSDetailsCallbackRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub "OpsifyCallbackRole-${ConnectionId}"

      AssumeRolePolicyDocument:

        Version: "2012-10-17"

        Statement:

          - Effect: Allow

            Principal:

              Service:
                lambda.amazonaws.com

            Action:
              - sts:AssumeRole


      Policies:

        - PolicyName: OpsifyAWSCallbackPolicy

          PolicyDocument:

            Version: "2012-10-17"

            Statement:

              - Sid: GetCallerIdentity

                Effect: Allow

                Action:
                  - sts:GetCallerIdentity

                Resource: "*"


              - Sid: GetDeploymentRole

                Effect: Allow

                Action:
                  - iam:GetRole

                Resource:
                  !GetAtt OpsifyDeploymentRole.Arn


              - Sid: LambdaLogging

                Effect: Allow

                Action:

                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource: "*"


  # ============================================================
  # 4. Callback Lambda
  # ============================================================

  AWSDetailsCallbackFunction:
    Type: AWS::Lambda::Function

    DependsOn:
      - AWSDetailsCallbackRole
      - OpsifyDeploymentRole

    Properties:

      FunctionName:
        !Sub "OpsifyCallback-${ConnectionId}"

      Runtime: python3.12

      Handler: index.handler

      Role:
        !GetAtt AWSDetailsCallbackRole.Arn

      Timeout: 30

      Code:

        ZipFile: |

          import json
          import os
          import urllib.request
          import boto3


          sts = boto3.client("sts")

          iam = boto3.client("iam")


          def send_cfn_response(
              event,
              context,
              status,
              reason="",
              data=None,
              physical_id=None
          ):

              body = {

                  "Status": status,

                  "Reason":
                      reason or
                      "See CloudWatch Logs",

                  "PhysicalResourceId":
                      physical_id or
                      context.log_stream_name,

                  "StackId":
                      event["StackId"],

                  "RequestId":
                      event["RequestId"],

                  "LogicalResourceId":
                      event["LogicalResourceId"],

                  "Data":
                      data or {}

              }


              request = urllib.request.Request(

                  event["ResponseURL"],

                  data=json.dumps(
                      body
                  ).encode("utf-8"),

                  method="PUT"

              )


              request.add_header(

                  "Content-Type",

                  "application/json"

              )


              with urllib.request.urlopen(

                  request,

                  timeout=10

              ) as response:

                  print(

                      "CloudFormation response:",

                      response.status

                  )


          def post_callback(
              callback_url,
              payload
          ):

              request = urllib.request.Request(

                  callback_url,

                  data=json.dumps(
                      payload
                  ).encode("utf-8"),

                  method="POST"

              )


              request.add_header(

                  "Content-Type",

                  "application/json"

              )


              request.add_header(

                  "X-Opsify-Connection-Id",

                  payload["connection_id"]

              )


              with urllib.request.urlopen(

                  request,

                  timeout=15

              ) as response:

                  response_body = (
                      response
                      .read()
                      .decode("utf-8")
                  )


                  print(

                      "Opsify response:",

                      response.status,

                      response_body

                  )


                  if (
                      response.status < 200
                      or response.status >= 300
                  ):

                      raise RuntimeError(

                          f"Opsify returned HTTP "
                          f"{response.status}: "
                          f"{response_body}"

                      )


          def handler(
              event,
              context
          ):

              print(
                  "Received CloudFormation event:"
              )

              print(
                  json.dumps(event)
              )


              physical_id = (

                  event.get(
                      "PhysicalResourceId"
                  )

                  or

                  event[
                      "ResourceProperties"
                  ].get(
                      "ConnectionId"
                  )

                  or

                  context.log_stream_name

              )


              try:

                  request_type = (
                      event["RequestType"]
                  )


                  # --------------------------------------------
                  # DELETE
                  # --------------------------------------------

                  if request_type == "Delete":

                      send_cfn_response(

                          event,

                          context,

                          "SUCCESS",

                          "Delete request handled",

                          physical_id=physical_id

                      )

                      return


                  properties = (
                      event[
                          "ResourceProperties"
                      ]
                  )


                  connection_id = (
                      properties[
                          "ConnectionId"
                      ]
                  )


                  github_user_id = (
                      properties[
                          "GitHubUserId"
                      ]
                  )


                  callback_url = (
                      properties[
                          "OpsifyCallbackUrl"
                      ]
                  )


                  role_name = (
                      properties[
                          "RoleName"
                      ]
                  )


                  # --------------------------------------------
                  # AWS identity
                  # --------------------------------------------

                  aws_account_id = (
                      sts
                      .get_caller_identity()
                      ["Account"]
                  )


                  aws_region = (
                      os.environ[
                          "AWS_REGION"
                      ]
                  )


                  # --------------------------------------------
                  # Deployment role
                  # --------------------------------------------

                  role = (
                      iam
                      .get_role(
                          RoleName=role_name
                      )
                      ["Role"]
                  )


                  # --------------------------------------------
                  # Stack
                  # --------------------------------------------

                  stack_name = (
                      event[
                          "StackId"
                      ]
                      .split("/")[1]
                  )


                  # --------------------------------------------
                  # Callback payload
                  # --------------------------------------------

                  payload = {

                      "connection_id":
                          connection_id,

                      "github_user_id":
                          github_user_id,

                      "aws_account_id":
                          aws_account_id,

                      "aws_region":
                          aws_region,

                      "role_name":
                          role_name,

                      "role_arn":
                          role["Arn"],

                      "status":
                          "connected",

                      "bootstrap_stack_name":
                          stack_name

                  }


                  print(
                      "Sending AWS details to Opsify:"
                  )

                  print(
                      json.dumps(payload)
                  )


                  # --------------------------------------------
                  # Notify Opsify
                  # --------------------------------------------

                  post_callback(

                      callback_url,

                      payload

                  )


                  # --------------------------------------------
                  # CloudFormation SUCCESS
                  # --------------------------------------------

                  send_cfn_response(

                      event,

                      context,

                      "SUCCESS",

                      "AWS details registered successfully",

                      data={

                          "ConnectionId":
                              connection_id,

                          "AWSAccountId":
                              aws_account_id,

                          "RoleName":
                              role_name,

                          "RoleArn":
                              role["Arn"]

                      },

                      physical_id=
                          connection_id

                  )


              except Exception as error:

                  print(

                      "Callback failed:",

                      str(error)

                  )


                  try:

                      send_cfn_response(

                          event,

                          context,

                          "FAILED",

                          str(error),

                          physical_id=
                              physical_id

                      )

                  except Exception as response_error:

                      print(

                          "Failed to send "
                          "CloudFormation failure response:",

                          str(response_error)

                      )


                  raise


  # ============================================================
  # 5. CloudFormation custom resource
  # ============================================================

  AWSDetailsCallback:
    Type: Custom::AWSDetailsCallback

    DependsOn:

      - OpsifyDeploymentRole
      - AWSDetailsCallbackFunction

    Properties:

      ServiceToken:
        !GetAtt AWSDetailsCallbackFunction.Arn

      ConnectionId:
        !Ref ConnectionId

      GitHubUserId:
        !Ref GitHubUserId

      OpsifyCallbackUrl:
        !Ref OpsifyCallbackUrl

      RoleName:
        !Ref OpsifyDeploymentRole


# ==============================================================
# Outputs
# ==============================================================

Outputs:

  AWSAccountId:
    Description:
      AWS account ID where the bootstrap stack is deployed.

    Value:
      !Ref AWS::AccountId


  DeploymentRoleArn:
    Description:
      Connection-specific IAM role ARN for GitHub Actions.

    Value:
      !GetAtt OpsifyDeploymentRole.Arn


  DeploymentRoleName:
    Description:
      Connection-specific IAM deployment role name.

    Value:
      !Ref OpsifyDeploymentRole


  GitHubOIDCProviderArn:
    Description:
      GitHub Actions OIDC provider used by the deployment role.

    Value:
      !GetAtt EnsureGitHubOIDCProvider.ProviderArn


  GitHubSubject:
    Description:
      GitHub OIDC subject trusted by the deployment role.

    Value:
      !Sub "repo:${GitHubOwner}/${GitHubRepository}:ref:refs/heads/${GitHubBranch}"