AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Opsify AWS bootstrap. Uses the GitHub Actions OIDC provider,
  creates an IAM deployment role and callback mechanism used to
  register the AWS connection with Opsify.

Parameters:

  GitHubUserId:
    Type: String
    Description: GitHub user ID associated with this Opsify AWS connection

  OpsifyCallbackUrl:
    Type: String
    Description: Opsify API endpoint used to register the AWS connection

  GitHubOwner:
    Type: String
    Description: GitHub organization or user name.
    Default: AtharvaGGourshete

  GitHubOwnerId:
    Type: String
    Description: GitHub owner numeric ID.
    Default: "158183496"

  GitHubRepository:
    Type: String
    Description: GitHub repository name.
    Default: Opsify

  GitHubRepositoryId:
    Type: String
    Description: GitHub repository numeric ID.
    Default: "1331317336"

  GitHubBranch:
    Type: String
    Description: GitHub branch allowed to deploy.
    Default: main


Resources:

  # ============================================================
  # 1. Deployment IAM Role
  # ============================================================

  OpsifyDeploymentRole:
    Type: AWS::IAM::Role

    Properties:

      Description: >
        IAM role assumed by GitHub Actions through GitHub OIDC
        for Opsify deployments.

      AssumeRolePolicyDocument:

        Version: "2012-10-17"

        Statement:

          - Effect: Allow

            Principal:
              Federated: !Sub >
                arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com

            Action:
              - sts:AssumeRoleWithWebIdentity

            Condition:

              StringEquals:

                token.actions.githubusercontent.com:aud:
                  - sts.amazonaws.com

                token.actions.githubusercontent.com:sub:
                  - !Sub >
                    repo:${GitHubOwner}/${GitHubRepository}:ref:refs/heads/${GitHubBranch}


      Policies:

        # --------------------------------------------------------
        # CloudFormation
        # --------------------------------------------------------

        - Sid: CloudFormation

          Effect: Allow

          Action:
            - cloudformation:*

          Resource: "*"


        # --------------------------------------------------------
        # S3
        # --------------------------------------------------------

        - Sid: SAMDeploymentBucket

          Effect: Allow

          Action:
            - s3:*

          Resource: "*"


        # --------------------------------------------------------
        # Lambda
        # --------------------------------------------------------

        - Sid: Lambda

          Effect: Allow

          Action:

            - lambda:CreateFunction
            - lambda:UpdateFunctionCode
            - lambda:UpdateFunctionConfiguration
            - lambda:DeleteFunction
            - lambda:GetFunction
            - lambda:GetFunctionConfiguration
            - lambda:ListVersionsByFunction
            - lambda:PublishVersion
            - lambda:CreateAlias
            - lambda:UpdateAlias
            - lambda:DeleteAlias
            - lambda:GetAlias
            - lambda:AddPermission
            - lambda:RemovePermission
            - lambda:TagResource
            - lambda:UntagResource

          Resource: "*"


        # --------------------------------------------------------
        # API Gateway
        # --------------------------------------------------------

        - Sid: APIGateway

          Effect: Allow

          Action:

            - apigateway:GET
            - apigateway:POST
            - apigateway:PUT
            - apigateway:PATCH
            - apigateway:DELETE
            - apigateway:TagResource

          Resource: "*"


        # --------------------------------------------------------
        # IAM roles created by SAM / CloudFormation
        # --------------------------------------------------------

        - Sid: IAMForSAMGeneratedRoles

          Effect: Allow

          Action:

            - iam:CreateRole
            - iam:DeleteRole
            - iam:GetRole
            - iam:PutRolePolicy
            - iam:DeleteRolePolicy
            - iam:AttachRolePolicy
            - iam:DetachRolePolicy
            - iam:TagRole
            - iam:UntagRole

          Resource: "*"


        # --------------------------------------------------------
        # PassRole
        # --------------------------------------------------------

        - Sid: PassRoleToLambda

          Effect: Allow

          Action:
            - iam:PassRole

          Resource: "*"

          Condition:

            StringEquals:
              iam:PassedToService:
                - lambda.amazonaws.com


        # --------------------------------------------------------
        # CloudWatch Logs
        # --------------------------------------------------------

        - Sid: CloudWatchLogs

          Effect: Allow

          Action:

            - logs:CreateLogGroup
            - logs:DeleteLogGroup
            - logs:PutRetentionPolicy
            - logs:DeleteRetentionPolicy
            - logs:TagResource

          Resource: "*"


  # ============================================================
  # 2. Lambda Execution Role
  # ============================================================

  AWSDetailsCallbackRole:
    Type: AWS::IAM::Role

    Properties:

      AssumeRolePolicyDocument:

        Version: "2012-10-17"

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole


      Policies:

        - PolicyName: OpsifyAWSCallbackPolicy

          PolicyDocument:

            Version: "2012-10-17"

            Statement:

              # --------------------------------------------------
              # Get AWS account ID
              # --------------------------------------------------

              - Effect: Allow

                Action:
                  - sts:GetCallerIdentity

                Resource: "*"


              # --------------------------------------------------
              # Get deployment role
              # --------------------------------------------------

              - Effect: Allow

                Action:
                  - iam:GetRole

                Resource:
                  - !GetAtt OpsifyDeploymentRole.Arn


              # --------------------------------------------------
              # Lambda logging
              # --------------------------------------------------

              - Effect: Allow

                Action:

                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource: "*"


  # ============================================================
  # 3. Callback Lambda
  # ============================================================

  AWSDetailsCallbackFunction:
    Type: AWS::Lambda::Function

    DependsOn:
      - AWSDetailsCallbackRole
      - OpsifyDeploymentRole

    Properties:

      Runtime: python3.12

      Handler: index.handler

      Role: !GetAtt AWSDetailsCallbackRole.Arn

      Timeout: 30

      Code:

        ZipFile: |

          import json
          import os
          import urllib.request
          import boto3


          sts = boto3.client("sts")
          iam = boto3.client("iam")


          def send_cfn_response(event, context, status, reason="", data=None):

              response_url = event["ResponseURL"]

              response_body = {
                  "Status": status,
                  "Reason": reason or "See CloudWatch Logs",
                  "PhysicalResourceId": context.log_stream_name,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": data or {}
              }

              response_data = json.dumps(response_body).encode("utf-8")

              request = urllib.request.Request(
                  response_url,
                  data=response_data,
                  method="PUT"
              )

              request.add_header(
                  "Content-Type",
                  ""
              )

              with urllib.request.urlopen(request) as response:

                  print(
                      "CloudFormation response:",
                      response.status
                  )


          def handler(event, context):

              print(
                  "Received CloudFormation event:"
              )

              print(
                  json.dumps(event)
              )

              try:

                  request_type = event["RequestType"]


                  # ------------------------------------------------
                  # Delete
                  # ------------------------------------------------

                  if request_type == "Delete":

                      send_cfn_response(
                          event,
                          context,
                          "SUCCESS",
                          "Delete request handled"
                      )

                      return


                  # ------------------------------------------------
                  # AWS account information
                  # ------------------------------------------------

                  identity = sts.get_caller_identity()

                  aws_account_id = identity["Account"]

                  aws_region = os.environ["AWS_REGION"]


                  # ------------------------------------------------
                  # CloudFormation parameters
                  # ------------------------------------------------

                  github_user_id = (
                      event["ResourceProperties"]
                      ["GitHubUserId"]
                  )

                  callback_url = (
                      event["ResourceProperties"]
                      ["OpsifyCallbackUrl"]
                  )

                  role_name = (
                      event["ResourceProperties"]
                      ["RoleName"]
                  )


                  # ------------------------------------------------
                  # Get IAM role
                  # ------------------------------------------------

                  role_response = iam.get_role(
                      RoleName=role_name
                  )

                  role_arn = (
                      role_response
                      ["Role"]
                      ["Arn"]
                  )


                  # ------------------------------------------------
                  # Stack information
                  # ------------------------------------------------

                  stack_id = event["StackId"]

                  stack_name = stack_id.split("/")[1]


                  # ------------------------------------------------
                  # Payload for Opsify
                  # ------------------------------------------------

                  payload = {

                      "github_user_id": github_user_id,

                      "aws_account_id": aws_account_id,

                      "aws_region": aws_region,

                      "role_name": role_name,

                      "role_arn": role_arn,

                      "status": "connected",

                      "bootstrap_stack_name": stack_name
                  }


                  print(
                      "Sending AWS details to Opsify:"
                  )

                  print(
                      json.dumps(payload)
                  )


                  # ------------------------------------------------
                  # POST to Opsify backend
                  # ------------------------------------------------

                  request_data = (
                      json.dumps(payload)
                      .encode("utf-8")
                  )

                  request = urllib.request.Request(
                      callback_url,
                      data=request_data,
                      method="POST"
                  )

                  request.add_header(
                      "Content-Type",
                      "application/json"
                  )


                  with urllib.request.urlopen(
                      request,
                      timeout=15
                  ) as response:

                      response_body = (
                          response
                          .read()
                          .decode("utf-8")
                      )

                      print(
                          "Opsify response:",
                          response.status,
                          response_body
                      )

                      if response.status < 200 or response.status >= 300:

                          raise Exception(
                              f"Opsify returned HTTP {response.status}"
                          )


                  # ------------------------------------------------
                  # Tell CloudFormation the custom resource succeeded
                  # ------------------------------------------------

                  send_cfn_response(

                      event,

                      context,

                      "SUCCESS",

                      "AWS details registered successfully",

                      {
                          "AWSAccountId": aws_account_id,

                          "RoleName": role_name,

                          "RoleArn": role_arn
                      }
                  )


              except Exception as error:

                  print(
                      "Callback failed:"
                  )

                  print(
                      str(error)
                  )


                  send_cfn_response(

                      event,

                      context,

                      "FAILED",

                      str(error)
                  )

                  raise


  # ============================================================
  # 4. CloudFormation Custom Resource
  # ============================================================

  AWSDetailsCallback:
    Type: Custom::AWSDetailsCallback

    DependsOn:

      - OpsifyDeploymentRole
      - AWSDetailsCallbackFunction

    Properties:

      ServiceToken:
        !GetAtt AWSDetailsCallbackFunction.Arn

      GitHubUserId:
        !Ref GitHubUserId

      OpsifyCallbackUrl:
        !Ref OpsifyCallbackUrl

      RoleName:
        !Ref OpsifyDeploymentRole


# ==============================================================
# Outputs
# ==============================================================

Outputs:

  AWSAccountId:

    Description:
      AWS account ID where the bootstrap stack is deployed.

    Value:
      !Ref AWS::AccountId


  DeploymentRoleArn:

    Description:
      IAM role ARN to use for Opsify deployments.

    Value:
      !GetAtt OpsifyDeploymentRole.Arn


  DeploymentRoleName:

    Description:
      IAM deployment role name.

    Value:
      !Ref OpsifyDeploymentRole


  GitHubOIDCProviderArn:

    Description:
      Existing GitHub Actions OIDC provider used by the deployment role.

    Value:
      !Sub >
        arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com


  GitHubSubject:

    Description:
      GitHub OIDC subject trusted by the deployment role.

    Value:
      !Sub >
        repo:${GitHubOwner}/${GitHubRepository}:ref:refs/heads/${GitHubBranch}