name: Deploy Node.js Test App

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::862205457196:role/OpsifyDeploymentRole-1331317336
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: backend/deployment/terraform/test-app
        run: terraform init

      - name: Terraform Validate
        working-directory: backend/deployment/terraform/test-app
        run: terraform validate

      - name: Terraform Plan
        working-directory: backend/deployment/terraform/test-app
        env:
          TF_VAR_container_image: 862205457196.dkr.ecr.ap-south-1.amazonaws.com/opsify-test-app:v1
        run: |
          terraform plan \
            -out=tfplan

      - name: Terraform Apply
        working-directory: backend/deployment/terraform/test-app
        env:
          TF_VAR_container_image: 862205457196.dkr.ecr.ap-south-1.amazonaws.com/opsify-test-app:v1
        run: |
          terraform apply \
            -auto-approve \
            tfplan

      - name: Show deployment information
        working-directory: backend/deployment/terraform/test-app
        run: |
          echo "========================================"
          echo "Opsify deployment completed"
          echo "========================================"

          echo "Load Balancer:"
          terraform output -raw load_balancer_dns_name

          echo "Application URL:"
          echo "http://$(terraform output -raw load_balancer_dns_name)"