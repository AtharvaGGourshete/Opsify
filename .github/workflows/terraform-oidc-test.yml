name: Terraform OIDC Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::862205457196:role/OpsifyDeploymentRole-1331317336
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: backend/deployment/terraform/test-app
        run: terraform init

      - name: Terraform Validate
        working-directory: backend/deployment/terraform/test-app
        run: terraform validate

      # ---------------------------------------------------------
      # Import resources created by previous failed deployments.
      # The GitHub runner starts with an empty Terraform state,
      # so we discover existing AWS resources and import them.
      # ---------------------------------------------------------
      - name: Import existing AWS resources
        working-directory: backend/deployment/terraform/test-app
        env:
          AWS_REGION: ap-south-1
          PROJECT_NAME: opsify-test-app
          TF_VAR_container_image: 862205457196.dkr.ecr.ap-south-1.amazonaws.com/opsify-test-app:v1
        run: |
          set -e

          echo "========================================"
          echo "Discovering existing AWS resources"
          echo "========================================"

          # -------------------------------------------------------
          # VPC
          # -------------------------------------------------------
          VPC_ID=$(aws ec2 describe-vpcs \
            --region "$AWS_REGION" \
            --filters "Name=tag:Name,Values=${PROJECT_NAME}-vpc" \
            --query 'Vpcs[0].VpcId' \
            --output text 2>/dev/null || echo "None")

          if [ "$VPC_ID" != "None" ] && [ -n "$VPC_ID" ]; then
            echo "VPC: $VPC_ID"
            terraform import aws_vpc.main "$VPC_ID" || true
          fi


          # -------------------------------------------------------
          # Internet Gateway
          # -------------------------------------------------------
          IGW_ID=$(aws ec2 describe-internet-gateways \
            --region "$AWS_REGION" \
            --filters "Name=tag:Name,Values=${PROJECT_NAME}-igw" \
            --query 'InternetGateways[0].InternetGatewayId' \
            --output text 2>/dev/null || echo "None")

          if [ "$IGW_ID" != "None" ] && [ -n "$IGW_ID" ]; then
            echo "Internet Gateway: $IGW_ID"
            terraform import aws_internet_gateway.main "$IGW_ID" || true
          fi


          # -------------------------------------------------------
          # Public subnet A
          # -------------------------------------------------------
          SUBNET_A=$(aws ec2 describe-subnets \
            --region "$AWS_REGION" \
            --filters "Name=tag:Name,Values=${PROJECT_NAME}-public-a" \
            --query 'Subnets[0].SubnetId' \
            --output text 2>/dev/null || echo "None")

          if [ "$SUBNET_A" != "None" ] && [ -n "$SUBNET_A" ]; then
            echo "Public subnet A: $SUBNET_A"
            terraform import aws_subnet.public_a "$SUBNET_A" || true
          fi


          # -------------------------------------------------------
          # Public subnet B
          # -------------------------------------------------------
          SUBNET_B=$(aws ec2 describe-subnets \
            --region "$AWS_REGION" \
            --filters "Name=tag:Name,Values=${PROJECT_NAME}-public-b" \
            --query 'Subnets[0].SubnetId' \
            --output text 2>/dev/null || echo "None")

          if [ "$SUBNET_B" != "None" ] && [ -n "$SUBNET_B" ]; then
            echo "Public subnet B: $SUBNET_B"
            terraform import aws_subnet.public_b "$SUBNET_B" || true
          fi


          # -------------------------------------------------------
          # Route table
          # -------------------------------------------------------
          ROUTE_TABLE=$(aws ec2 describe-route-tables \
            --region "$AWS_REGION" \
            --filters "Name=tag:Name,Values=${PROJECT_NAME}-public-rt" \
            --query 'RouteTables[0].RouteTableId' \
            --output text 2>/dev/null || echo "None")

          if [ "$ROUTE_TABLE" != "None" ] && [ -n "$ROUTE_TABLE" ]; then
            echo "Route table: $ROUTE_TABLE"
            terraform import aws_route_table.public "$ROUTE_TABLE" || true
          fi


          # -------------------------------------------------------
          # Route table associations
          #
          # IMPORTANT:
          # aws_route_table_association import format is:
          # subnet-id/route-table-id
          # -------------------------------------------------------
          if [ "$SUBNET_A" != "None" ] && [ "$ROUTE_TABLE" != "None" ]; then
            echo "Route association A: ${SUBNET_A}/${ROUTE_TABLE}"
            terraform import \
              aws_route_table_association.public_a \
              "${SUBNET_A}/${ROUTE_TABLE}" || true
          fi

          if [ "$SUBNET_B" != "None" ] && [ "$ROUTE_TABLE" != "None" ]; then
            echo "Route association B: ${SUBNET_B}/${ROUTE_TABLE}"
            terraform import \
              aws_route_table_association.public_b \
              "${SUBNET_B}/${ROUTE_TABLE}" || true
          fi


          # -------------------------------------------------------
          # ALB security group
          # -------------------------------------------------------
          ALB_SG=$(aws ec2 describe-security-groups \
            --region "$AWS_REGION" \
            --filters "Name=group-name,Values=${PROJECT_NAME}-alb-sg" \
            --query 'SecurityGroups[0].GroupId' \
            --output text 2>/dev/null || echo "None")

          if [ "$ALB_SG" != "None" ] && [ -n "$ALB_SG" ]; then
            echo "ALB security group: $ALB_SG"
            terraform import aws_security_group.alb "$ALB_SG" || true
          fi


          # -------------------------------------------------------
          # ECS security group
          # -------------------------------------------------------
          ECS_SG=$(aws ec2 describe-security-groups \
            --region "$AWS_REGION" \
            --filters "Name=group-name,Values=${PROJECT_NAME}-ecs-sg" \
            --query 'SecurityGroups[0].GroupId' \
            --output text 2>/dev/null || echo "None")

          if [ "$ECS_SG" != "None" ] && [ -n "$ECS_SG" ]; then
            echo "ECS security group: $ECS_SG"
            terraform import aws_security_group.ecs "$ECS_SG" || true
          fi


          # -------------------------------------------------------
          # ECS cluster
          # -------------------------------------------------------
          CLUSTER=$(aws ecs describe-clusters \
            --region "$AWS_REGION" \
            --clusters "${PROJECT_NAME}-cluster" \
            --query 'clusters[0].clusterName' \
            --output text 2>/dev/null || echo "None")

          if [ "$CLUSTER" != "None" ] && [ -n "$CLUSTER" ]; then
            echo "ECS cluster: $CLUSTER"
            terraform import aws_ecs_cluster.main "$CLUSTER" || true
          fi


          # -------------------------------------------------------
          # IAM execution role
          # -------------------------------------------------------
          ROLE_NAME="${PROJECT_NAME}-ecs-task-execution-role"

          if aws iam get-role \
            --role-name "$ROLE_NAME" >/dev/null 2>&1; then

            echo "IAM execution role: $ROLE_NAME"

            terraform import \
              aws_iam_role.ecs_task_execution \
              "$ROLE_NAME" || true

            POLICY_NAME="${PROJECT_NAME}-ecs-task-execution-policy"

            if aws iam get-role-policy \
              --role-name "$ROLE_NAME" \
              --policy-name "$POLICY_NAME" >/dev/null 2>&1; then

              echo "IAM execution policy: $POLICY_NAME"

              terraform import \
                aws_iam_role_policy.ecs_task_execution \
                "${ROLE_NAME}:${POLICY_NAME}" || true
            fi
          fi


          # -------------------------------------------------------
          # CloudWatch log group
          # -------------------------------------------------------
          LOG_GROUP="/opsify/${PROJECT_NAME}"

          LOG_GROUP_EXISTS=$(aws logs describe-log-groups \
            --region "$AWS_REGION" \
            --log-group-name-prefix "$LOG_GROUP" \
            --query "logGroups[?logGroupName=='$LOG_GROUP'] | length(@)" \
            --output text 2>/dev/null || echo "0")

          if [ "$LOG_GROUP_EXISTS" = "1" ]; then
            echo "CloudWatch log group: $LOG_GROUP"

            terraform import \
              aws_cloudwatch_log_group.app \
              "$LOG_GROUP" || true
          fi


          # -------------------------------------------------------
          # Target group
          # -------------------------------------------------------
          TG_ARN=$(aws elbv2 describe-target-groups \
            --region "$AWS_REGION" \
            --names "${PROJECT_NAME}-tg" \
            --query 'TargetGroups[0].TargetGroupArn' \
            --output text 2>/dev/null || echo "None")

          if [ "$TG_ARN" != "None" ] && [ -n "$TG_ARN" ]; then
            echo "Target group: $TG_ARN"

            terraform import \
              aws_lb_target_group.app \
              "$TG_ARN" || true
          fi


          # -------------------------------------------------------
          # Application Load Balancer
          #
          # It may not exist because the previous deployment failed.
          # If it doesn't exist, Terraform will create it later.
          # -------------------------------------------------------
          LB_ARN=$(aws elbv2 describe-load-balancers \
            --region "$AWS_REGION" \
            --names "${PROJECT_NAME}-alb" \
            --query 'LoadBalancers[0].LoadBalancerArn' \
            --output text 2>/dev/null || echo "None")

          if [ "$LB_ARN" != "None" ] && [ -n "$LB_ARN" ]; then
            echo "Load balancer: $LB_ARN"

            terraform import \
              aws_lb.app \
              "$LB_ARN" || true

            LISTENER_ARN=$(aws elbv2 describe-listeners \
              --region "$AWS_REGION" \
              --load-balancer-arn "$LB_ARN" \
              --query 'Listeners[?Port==`80`].ListenerArn | [0]' \
              --output text 2>/dev/null || echo "None")

            if [ "$LISTENER_ARN" != "None" ] && [ -n "$LISTENER_ARN" ]; then
              echo "HTTP listener: $LISTENER_ARN"

              terraform import \
                aws_lb_listener.http \
                "$LISTENER_ARN" || true
            fi
          else
            echo "ALB does not exist yet. Terraform will create it."
          fi


          # -------------------------------------------------------
          # Task definition
          # -------------------------------------------------------
          TASK_DEF=$(aws ecs list-task-definitions \
            --region "$AWS_REGION" \
            --family-prefix "$PROJECT_NAME" \
            --status ACTIVE \
            --sort DESC \
            --query 'taskDefinitionArns[0]' \
            --output text 2>/dev/null || echo "None")

          if [ "$TASK_DEF" != "None" ] && [ -n "$TASK_DEF" ]; then
            echo "Task definition: $TASK_DEF"

            terraform import \
              aws_ecs_task_definition.app \
              "$TASK_DEF" || true
          fi


          # -------------------------------------------------------
          # ECS service
          # -------------------------------------------------------
          SERVICE_NAME="${PROJECT_NAME}-service"

          SERVICE_ARN=$(aws ecs describe-services \
            --region "$AWS_REGION" \
            --cluster "${PROJECT_NAME}-cluster" \
            --services "$SERVICE_NAME" \
            --query 'services[0].serviceArn' \
            --output text 2>/dev/null || echo "None")

          if [ "$SERVICE_ARN" != "None" ] && [ -n "$SERVICE_ARN" ]; then
            echo "ECS service: $SERVICE_NAME"

            terraform import \
              aws_ecs_service.app \
              "${PROJECT_NAME}-cluster/${SERVICE_NAME}" || true
          fi


          echo
          echo "========================================"
          echo "Terraform state after imports"
          echo "========================================"

          terraform state list || true
      - name: Terraform Plan
        working-directory: backend/deployment/terraform/test-app
        run: |
          terraform plan \
            -var="container_image=862205457196.dkr.ecr.ap-south-1.amazonaws.com/opsify-test-app:v1"

      - name: Terraform Apply
        working-directory: backend/deployment/terraform/test-app
        run: |
          terraform apply \
            -auto-approve \
            -var="container_image=862205457196.dkr.ecr.ap-south-1.amazonaws.com/opsify-test-app:v1"

      - name: Show deployment information
        working-directory: backend/deployment/terraform/test-app
        run: |
          echo "========================================"
          echo "Opsify deployment completed"
          echo "========================================"

          echo "Load Balancer:"
          terraform output -raw load_balancer_dns_name

          echo "Application URL:"
          echo "http://$(terraform output -raw load_balancer_dns_name)"