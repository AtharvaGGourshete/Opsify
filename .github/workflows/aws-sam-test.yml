name: AWS SAM Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          # role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/OpsifyGitHubActionsRole
          role-to-assume: arn:aws:iam::787471169631:role/OpsifyGitHubActionsRole
          aws-region: ap-south-1

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: SAM build
        working-directory: backend/deployment/aws
        run: sam build

      - name: SAM deploy
        working-directory: backend/deployment/aws
        run: |
          sam deploy \
          --stack-name opsify-sam-test \
          --region ap-south-1 \
          --resolve-s3 \
          --capabilities CAPABILITY_IAM \
          --no-confirm-changeset \
          --no-fail-on-empty-changeset