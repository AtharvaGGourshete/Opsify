name: AWS SAM Deployment

on:
  workflow_dispatch:
    inputs:

      deployment_id:
        description: "Opsify deployment ID"
        required: true
        type: string

      role_arn:
        description: "AWS deployment role ARN created by Opsify Bootstrap"
        required: true
        type: string

      aws_region:
        description: "AWS region for deployment"
        required: true
        default: "ap-south-1"
        type: string

permissions:
  id-token: write
  contents: read

env:
  STACK_NAME: opsify-sam-test

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. Authenticate GitHub Actions with AWS using OIDC
      # ---------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}


      # ---------------------------------------------------------
      # 3. Verify AWS identity
      # ---------------------------------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # ---------------------------------------------------------
      # 4. Get AWS account ID
      # ---------------------------------------------------------
      - name: Get AWS account information
        id: aws-info
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "aws_account_id=$AWS_ACCOUNT_ID" >> "$GITHUB_OUTPUT"

          echo "AWS Account ID: $AWS_ACCOUNT_ID"


      # ---------------------------------------------------------
      # 5. Get IAM role information
      # ---------------------------------------------------------
      - name: Get IAM role information
        id: role-info
        env:
          ROLE_ARN: ${{ inputs.role_arn }}
        run: |
          ROLE_NAME="${ROLE_ARN##*/}"

          echo "role_name=$ROLE_NAME" >> "$GITHUB_OUTPUT"

          echo "Role Name: $ROLE_NAME"
          echo "Role ARN: $ROLE_ARN"


      # ---------------------------------------------------------
      # 6. Setup AWS SAM CLI
      # ---------------------------------------------------------
      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2


      # ---------------------------------------------------------
      # 7. Build SAM application
      # ---------------------------------------------------------
      - name: SAM build
        working-directory: backend/deployment
        run: |
          sam build


      # ---------------------------------------------------------
      # 8. Deploy SAM application
      # ---------------------------------------------------------
      - name: SAM deploy
        working-directory: backend/deployment
        env:
          AWS_REGION: ${{ inputs.aws_region }}
          STACK_NAME: ${{ env.STACK_NAME }}
        run: |
          sam deploy \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset


      # ---------------------------------------------------------
      # 9. Get CloudFormation stack information
      # ---------------------------------------------------------
      - name: Get CloudFormation stack information
        id: stack-info
        env:
          AWS_REGION: ${{ inputs.aws_region }}
          STACK_NAME: ${{ env.STACK_NAME }}
        run: |

          echo "Getting CloudFormation stack information..."

          STACK_ID=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackId' \
            --output text)

          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "stack_id=$STACK_ID" >> "$GITHUB_OUTPUT"
          echo "stack_status=$STACK_STATUS" >> "$GITHUB_OUTPUT"

          echo "Stack ID: $STACK_ID"
          echo "Stack Status: $STACK_STATUS"


      # ---------------------------------------------------------
      # 10. Get CloudFormation outputs
      # ---------------------------------------------------------
      - name: Get CloudFormation outputs
        id: stack-outputs
        env:
          AWS_REGION: ${{ inputs.aws_region }}
          STACK_NAME: ${{ env.STACK_NAME }}
        run: |

          echo "Getting CloudFormation outputs..."

          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs' \
            --output json > stack-outputs.json

          cat stack-outputs.json


      # ---------------------------------------------------------
      # 11. Extract deployment URL if available
      # ---------------------------------------------------------
      - name: Get deployment URL
        id: deployment-url
        env:
          AWS_REGION: ${{ inputs.aws_region }}
          STACK_NAME: ${{ env.STACK_NAME }}
        run: |

          DEPLOYMENT_URL=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue | [0]" \
            --output text)

          # If no ApiUrl output exists, don't fail the workflow.
          if [ "$DEPLOYMENT_URL" = "None" ] || [ -z "$DEPLOYMENT_URL" ]; then
            DEPLOYMENT_URL=""
          fi

          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

          echo "Deployment URL: $DEPLOYMENT_URL"


      # ---------------------------------------------------------
      # 12. Build deployment metadata
      # ---------------------------------------------------------
      - name: Build deployment metadata
        id: metadata
        env:
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}

          AWS_ACCOUNT_ID: ${{ steps.aws-info.outputs.aws_account_id }}
          AWS_REGION: ${{ inputs.aws_region }}

          ROLE_NAME: ${{ steps.role-info.outputs.role_name }}
          ROLE_ARN: ${{ inputs.role_arn }}

          STACK_NAME: ${{ env.STACK_NAME }}
          STACK_ID: ${{ steps.stack-info.outputs.stack_id }}
          STACK_STATUS: ${{ steps.stack-info.outputs.stack_status }}

          DEPLOYMENT_URL: ${{ steps.deployment-url.outputs.deployment_url }}

        run: |

          cat > deployment-metadata.json <<EOF
          {
            "deployment_id": "$DEPLOYMENT_ID",
            "aws_account_id": "$AWS_ACCOUNT_ID",
            "aws_region": "$AWS_REGION",
            "role_name": "$ROLE_NAME",
            "role_arn": "$ROLE_ARN",
            "stack_name": "$STACK_NAME",
            "stack_id": "$STACK_ID",
            "stack_status": "$STACK_STATUS",
            "deployment_url": "$DEPLOYMENT_URL"
          }
          EOF

          echo "Deployment metadata:"
          cat deployment-metadata.json


      # ---------------------------------------------------------
      # 13. Send deployment information to Opsify backend
      # ---------------------------------------------------------
      - name: Register AWS deployment with Opsify
        env:
          OPSIFY_API_URL: ${{ vars.OPSIFY_API_URL }}
          OPSIFY_API_TOKEN: ${{ secrets.OPSIFY_API_TOKEN }}

          DEPLOYMENT_ID: ${{ inputs.deployment_id }}

          AWS_ACCOUNT_ID: ${{ steps.aws-info.outputs.aws_account_id }}
          AWS_REGION: ${{ inputs.aws_region }}

          ROLE_NAME: ${{ steps.role-info.outputs.role_name }}
          ROLE_ARN: ${{ inputs.role_arn }}

          STACK_NAME: ${{ env.STACK_NAME }}
          STACK_ID: ${{ steps.stack-info.outputs.stack_id }}
          STACK_STATUS: ${{ steps.stack-info.outputs.stack_status }}

          DEPLOYMENT_URL: ${{ steps.deployment-url.outputs.deployment_url }}

        run: |

          echo "Registering deployment with Opsify..."

          curl --fail-with-body \
            --request POST \
            --url "$OPSIFY_API_URL/api/deployments/aws" \
            --header "Authorization: Bearer $OPSIFY_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data "{
              \"deployment_id\": \"$DEPLOYMENT_ID\",
              \"aws_account_id\": \"$AWS_ACCOUNT_ID\",
              \"aws_region\": \"$AWS_REGION\",
              \"role_name\": \"$ROLE_NAME\",
              \"role_arn\": \"$ROLE_ARN\",
              \"stack_name\": \"$STACK_NAME\",
              \"stack_id\": \"$STACK_ID\",
              \"stack_status\": \"$STACK_STATUS\",
              \"deployment_url\": \"$DEPLOYMENT_URL\"
            }"

          echo "AWS deployment successfully registered with Opsify."